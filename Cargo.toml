[workspace]
members = [ "test_directx", "vectron_app",
    "vectron_embedder",
    "vectron_gpu", "vectron_gui", 
    "vectron_render", "vectron_wgpu",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Vectron Team"]
