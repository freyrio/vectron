[package]
name = "test_directx"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true

[dependencies]
windows = { version = "0.56.0", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_SystemServices", # For D3D_FEATURE_LEVEL
    "Win32_UI_WindowsAndMessaging", # For HWND
    "Win32_Graphics_Direct3D_Fxc", # For D3DCompile
] }
vectron_embedder = { path = "../vectron_embedder" }
font-kit = "0.11"
raw-window-handle = "0.6"
thiserror = "1.0"
rusttype = "0.9"

[[example]]
name = "basic"
path = "examples/basic_clear_color/main.rs"

[[example]]
name = "cube3d"
path = "examples/cube_3d/main.rs"